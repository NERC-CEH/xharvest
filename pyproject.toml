[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[project]
name = "xharvest"
version = "0.1.0"
description = "Harvest environmental data from many providers into standardised, xarray-ready netCDF."
authors = [
    { name = "Joe Marsh Rossney", email = "17361029+jmarshrossney@users.noreply.github.com" }
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "netcdf4>=1.7.4",
    "numpy>=2.4.2",
    "typer>=0.24.1",
    "xarray>=2026.2.0",
    "xarray-annotated[cf]>=0.9.0rc1",
]
keywords = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://nerc-ceh.github.io/xharvest"
Repository = "https://github.com/NERC-CEH/xharvest"
Documentation = "https://nerc-ceh.github.io/xharvest"

[project.optional-dependencies]
cosmos = [
    "httpx>=0.28.1",
]
all = ["xharvest[cosmos]"]

[project.scripts]
xharvest = "xharvest.cli:main"

[project.entry-points."catena.modules"]
cosmos = "xharvest.cosmos.nodes"

# These bounds are floors, not pins: `uv sync` already resolves to the newest
# version each one allows, so raising them changes nothing for anyone. Do not
# "freshen" them, by hand or by bot. They exist only to stop resolution
# reaching for something ancient, and `[tool.uv] exclude-newer` below means a
# floor above the version that existed a week ago fails resolution outright.
# So these want to be low. Raise one only to reach a feature you need.
[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pyright>=1.1.411",
    "ruff>=0.16.1",
    "rust-just>=1.57.0",
    {include-group = "docs"},
    {include-group = "test"},
]
docs = [
    "mkdocs-typer2[termynal]>=0.4.1",
    "mkdocstrings-python>=2.0.5",
    "zensical>=0.0.52",
]
# Tests cover every connector, so they need every extra, and catena itself for the
# end-to-end pipeline test.
test = [
    "ukceh-catena",
    "xharvest[all]",
    "coverage>=7.15.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest]
testpaths = ["tests"]
# Tests marked `live` call real provider APIs; run them with `just test-live`.
addopts = ["-m", "not live"]
markers = ["live: calls a real provider API over the network"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src/", "tests/"]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
# Ruff broadened its default rule set in 0.16, so always select explicitly:
# that way a version bump cannot change which rules apply.
select = [
    "E",   # pycodestyle errors
    "D",   # pydocstyle
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
    "PT",  # flake8-pytest-style
    "I",   # isort
]

[tool.ruff.lint.per-file-ignores]
# Exempt tests from docstring requirements.
"tests/**" = ["D", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv]
# Resolve against the index as it was a week ago, so a same-day release cannot
# break a fresh `uv sync`. Note the corollary: a lower bound in
# [dependency-groups] must be at or below the version that existed a week ago,
# or resolution fails outright.
exclude-newer = "1 week"
# Exempt xarray-annotated from the cutoff: its releases are worth picking up the
# day they land, because the contracts depend on it closely.
exclude-newer-package = { xarray-annotated = false }

[tool.uv.sources]
ukceh-catena = { git = "https://github.com/NERC-CEH/catena", branch = "main" }
